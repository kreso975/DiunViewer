<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIUN Viewer</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/assets/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/app.css?v=1">

    <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="./assets/img/touch-icon-iphone.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/img/touch-icon-iphone-retina.png" />
    <link rel="apple-touch-startup-image" href="./assets/img/launch.png" />
    <link rel="icon" href="./assets/img/favicon.png" />
</head>

<body class="layout-fixed sidebar-expand-xxl bg-body-tertiary">

<div class="app-wrapper">

    <!-- HEADER -->
    <nav class="app-header navbar navbar-expand bg-body-secondary shadow-sm">
        <div class="container-fluid">

            <!-- LEFT SIDE -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                        <i class="bi bi-list"></i>
                    </a>
                </li>
            </ul>

            <!-- RIGHT SIDE -->
            <ul class="navbar-nav ms-auto align-items-center">

                <!-- MESSAGES ICON (NetAlertX style) -->
                <li class="nav-item position-relative me-3">
                    <a id="messages-button" href="#" class="nav-link p-2" data-page="events">
                        <i class="bi bi-chat-dots fs-5"></i>
                    </a>
                    <span id="messages-count"
                        class="badge bg-danger unread-messages-badge d-none">
                    </span>
                </li>

                <!-- ONLINE STATUS -->
                <li class="nav-item me-3 position-relative">
                    <span class="badge bg-secondary"
                        id="status-badge"
                        style="cursor:pointer;">
                        Loading…
                    </span>

                    <!-- Custom hover panel -->
                    <div id="health-panel" class="health-panel d-none shadow-sm">
                        <div class="p-2" id="health-panel-content">
                            <!-- JS fills this -->
                        </div>
                    </div>
                </li>

            </ul>

        </div>
    </nav>




    <!-- SIDEBAR -->
    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">

        <div class="sidebar-brand">
            <a href="?id=home" class="brand-link">
                <img src="./assets/img/diun-logo.png" alt="DIUN" class="brand-image">
                <span class="brand-text fw-light">DIUN Viewer</span>
            </a>
        </div>

        <div class="sidebar-wrapper">
            <nav class="mt-2">
                <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                    <li class="nav-item">
                        <a href="#" class="nav-link active" data-page="images">
                            <i class="nav-icon fas fa-images"></i>
                            <p>Docker Images</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-page="page-diun-images">
                            <i class="nav-icon fas fa-images"></i>
                            <p>DIUN Images</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-page="events">
                            <i class="nav-icon fas fa-bell"></i>
                            <p>Events</p>
                        </a>
                    </li>
                    <li class="nav-item diun-metrics-item d-none">
                        <a href="#" class="nav-link" data-page="page-diun-metrics">
                            <i class="nav-icon fas fa-chart-line"></i>
                            <p>DIUN Metrics</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="app-main">
        <div class="app-content pt-3 px-3">

            <!-- Images page -->
            <div id="page-images">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title mb-0 flex-grow-1">Docker Images</h3>

                        <button id="refresh-images" class="btn btn-sm btn-outline-secondary ms-auto">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <table id="images" class="table table-striped table-bordered">
                            <thead>
                            <tr>
                                <th>Name</th>
                                <th>Tag</th>
                                <th>Digest</th>
                                <th>Status</th>
                                <th>Created</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Events page -->
            <div id="page-events" style="display:none;">
                <div class="mb-2">
                    <label for="ev-check-all" style="cursor:pointer; font-weight: normal;">
                        <input type="checkbox" id="ev-check-all" class="me-1">
                        Select all
                    </label>
                    <button id="ev-delete-selected" class="btn btn-danger btn-sm ms-2">Delete selected</button>
                    <button id="ev-delete-all" class="btn btn-secondary btn-sm ms-1">Delete all</button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Events</h3>
                    </div>
                    <div id="ev-alerts"></div>
                    <div class="card-body">
                        <table id="events" class="table table-striped table-bordered">
                            <thead>
                            <tr>
                                <th>Image</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Received</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- DIUN IMAGES page -->
            <div id="page-diun-images" style="display:none;">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="card-title mb-0 flex-grow-1">DIUN Images</h3>

                        <button id="refresh-diun-images" class="btn btn-sm btn-outline-secondary ms-auto">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div class="card-body">
                        <table id="diun-images" class="table table-striped table-bordered">
                            <thead>
                            <tr>
                                <th>Name</th>
                                <th>Tag</th>
                                <th>Digest</th>
                                <th>Created</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- DIUN METRICS page -->
            <div id="page-diun-metrics" style="display:none;"></div>

        </div>
    </main>

    <!-- MODAL -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content shadow-lg border-0 rounded-3">

            <div class="modal-header bg-primary text-white rounded-top">
                <h5 class="modal-title d-flex align-items-center">
                <i class="fas fa-docker me-2"></i>
                <span id="imageModalTitle">Image details</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body p-4" id="imageModalBody"></div>

            <div class="modal-footer bg-light rounded-bottom">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                Close
                </button>
            </div>

            </div>
        </div>
    </div>

    <footer class="app-footer"> <!--begin::To the end-->
        <div class="float-end d-none d-sm-inline">K.K.</div>
        <!--end::To the end--> <!--begin::Copyright-->
        <strong>
            Copyright © 2014‑<span id="year"></span>
            Stergo Smart.
        </strong>

        <script>
            document.getElementById("year").textContent = new Date().getFullYear();
        </script>

        All rights reserved.
        <!--end::Copyright-->
    </footer> <!--end::Footer-->
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/adminlte.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap4.min.js"></script>

<script type="module" src="/assets/js/app.js?v=2"></script>

</body>
</html>
